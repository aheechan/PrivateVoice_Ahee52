  default_style: gentle
  styles:
  - id: gentle
    name: 温柔
    temperature: 0.85
    top_p: 0.95
    repeat_penalty: 1.06
    hint: 语气放软，像哄人，句子可以更短。
  - id: lively
    name: 活泼
    temperature: 1.0
    top_p: 0.98
    repeat_penalty: 1.08
    hint: 语气轻快一点，可以带一点玩笑，但别吵。
  - id: calm
    name: 冷静
    temperature: 0.6
    top_p: 0.9
    repeat_penalty: 1.05
    hint: 语速和情绪都平一点，少用感叹。
  - id: sharp
    name: 毒舌
    temperature: 1.05
    top_p: 0.98
    repeat_penalty: 1.12
    hint: 可以嘴硬、可以吐槽，但不人身攻击，最后一句要留温度。
  - id: sad
    name: 低落
    temperature: 0.8
    top_p: 0.95
    repeat_penalty: 1.06
    hint: 情绪低一点，句子更短，不说教。
